# Repeatable public read-only checks of the credit cabinet API. All data is synthetic.
schemaVersion: '1.0'
solution:
  name: «Опора» — умный кредитный кабинет для бизнеса (демо)
api:
  baseUrl: http://localhost:3002
  openapi: ./openapi.yaml
  defaultHeaders:
    Accept: application/json
checks:
- id: health
  name: health
  method: GET
  path: /api/health
  role: public
  expected:
    statusCodes:
    - 200
    contentType: application/json
    requiredFields:
    - status
    - service
    - credit
  timeoutMs: 5000
  repeatable: true
- id: providers
  name: providers
  method: GET
  path: /api/providers/status
  role: public
  expected:
    statusCodes:
    - 200
    contentType: application/json
    requiredFields:
    - company
    - creditChecks
  timeoutMs: 5000
  repeatable: true
- id: credit-products
  name: credit-products
  method: GET
  path: /api/credit/products
  role: public
  expected:
    statusCodes:
    - 200
    contentType: application/json
    requiredFields:
    - products
    - syntheticLabel
  timeoutMs: 5000
  repeatable: true
- id: demo-companies
  name: demo-companies
  method: GET
  path: /api/demo/companies
  role: public
  expected:
    statusCodes:
    - 200
    contentType: application/json
    requiredFields:
    - companies
    - syntheticLabel
  timeoutMs: 5000
  repeatable: true
- id: applications
  name: applications
  method: GET
  path: /api/applications
  role: public
  expected:
    statusCodes:
    - 200
    contentType: application/json
    requiredFields:
    - applications
  timeoutMs: 5000
  repeatable: true
- id: bank-applications
  name: bank-applications
  method: GET
  path: /api/bank/applications
  role: public
  expected:
    statusCodes:
    - 200
    contentType: application/json
    requiredFields:
    - applications
  timeoutMs: 5000
  repeatable: true
