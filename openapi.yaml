openapi: 3.0.3
info:
  title: «Опора» — умный кредитный кабинет для бизнеса — API
  version: 3.0.0
  description: |
    Демонстрационный модуль финансирования цифрового банка для бизнеса. Пять шагов одной заявки:
    Потребность → Подбор → Анкета → Рассмотрение → Решение, затем моделируемые подписание, выдача и сопровождение.

    Конвейер рассмотрения: проверка полноты → mock-проверки (ФНС, БКИ, финансы) → ML-оценка риска (демо-модель на
    синтетических данных) → детерминированный скоринг → решение по правилам (CreditDecisionEngine).
    ML и LLM решение не принимают. LLM-ассистент необязателен (AI_ENABLED=false по умолчанию) и только формулирует
    объяснения и разбирает текст потребности; при отключении или сбое используется детерминированный шаблон.

    Все компании, продукты, ставки (ключевая ставка + маржа + надбавка за риск — иллюстрация, а не формула банка),
    проверки, оценки и решения синтетические. Реальные системы и данные Альфа-Банка не используются.
    Ролевая модель «Клиент / Банковская сторона» — демонстрационная, без авторизации.

    Команды POST принимают необязательный заголовок Idempotency-Key: повтор с тем же ключом и телом возвращает
    сохранённый ответ (заголовок Idempotent-Replayed: true). Каждый ответ содержит X-Request-Id.
servers:
  - url: http://localhost:3002
    description: API (локально и в Docker)
  - url: http://localhost:3000
    description: Через frontend proxy (Vite / nginx в Docker)
tags:
  - name: Service
  - name: Catalog
  - name: Companies
  - name: Applications
  - name: Bank
  - name: Financing
  - name: Assistant
paths:
  /api/health:
    get:
      tags: [Service]
      summary: Работоспособность API
      responses:
        '200':
          description: API работает, синтетические данные загружены
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /api/providers/status:
    get:
      tags: [Service]
      summary: Состояние источников данных
      description: Реестровый поиск компании (DaData/индекс ФНС) необязателен; кредитные проверки всегда локальные mock.
      responses:
        '200':
          description: Состояние источников
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProvidersStatus' }
  /api/company/{inn}:
    get:
      tags: [Companies]
      summary: Необязательный реестровый поиск компании (DaData или импортированный индекс ФНС)
      description: Используется внутри GET /api/companies/{inn}. Без ключа DaData и без импортированного индекса возвращает 503.
      parameters:
        - $ref: '#/components/parameters/Inn'
      responses:
        '200':
          description: Компания найдена в подключённом источнике
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistryCompanyResponse' }
        '400': { $ref: '#/components/responses/LegacyError' }
        '404': { $ref: '#/components/responses/LegacyError' }
        '429': { $ref: '#/components/responses/LegacyError' }
        '502': { $ref: '#/components/responses/LegacyError' }
        '503': { $ref: '#/components/responses/LegacyError' }
  /api/credit/products:
    get:
      tags: [Catalog]
      summary: Синтетические кредитные продукты и подбор под потребность
      description: Без параметров возвращает каталог. С параметрами потребности дополнительно возвращает matches — пригодность каждого продукта с объяснением.
      parameters:
        - { in: query, name: inn, schema: { type: string }, description: ИНН сохранённой компании (для срока работы бизнеса) }
        - { in: query, name: registrationDate, schema: { type: string, format: date }, description: 'Дата регистрации, если компания ещё не сохранена' }
        - { in: query, name: purpose, schema: { $ref: '#/components/schemas/CreditPurpose' } }
        - { in: query, name: amount, schema: { type: integer, minimum: 10000, maximum: 1000000000 } }
        - { in: query, name: term, schema: { type: integer, minimum: 1, maximum: 120 }, description: Срок в месяцах }
      responses:
        '200':
          description: Продукты и (опционально) результат подбора
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductsResponse' }
        '400': { $ref: '#/components/responses/Error' }
  /api/demo/companies:
    get:
      tags: [Companies]
      summary: Синтетические демо-компании (клиенты банка A–D, не клиенты E–F)
      responses:
        '200':
          description: Демо-компании
          content:
            application/json:
              schema:
                type: object
                required: [companies, syntheticLabel]
                properties:
                  companies: { type: array, items: { $ref: '#/components/schemas/Company' } }
                  syntheticLabel: { type: string, example: Синтетические демонстрационные данные }
  /api/companies/{inn}:
    get:
      tags: [Companies]
      summary: Компания по ИНН
      description: Сначала синтетические и ранее сохранённые компании, затем необязательный реестровый поиск. 404 — заполните сведения вручную.
      parameters:
        - $ref: '#/components/parameters/Inn'
      responses:
        '200':
          description: Компания найдена
          content:
            application/json:
              schema:
                type: object
                required: [company]
                properties:
                  company: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/applications:
    post:
      tags: [Applications]
      summary: Создать заявку (DRAFT; при переданных данных — сразу DATA_COLLECTION/READY_TO_SUBMIT)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateApplication' }
      responses:
        '201':
          description: Заявка создана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationView' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    get:
      tags: [Applications]
      summary: Список заявок (демо-клиент видит все заявки)
      parameters:
        - { in: query, name: inn, schema: { type: string }, description: Фильтр по ИНН компании }
      responses:
        '200':
          description: Заявки, новые первыми
          content:
            application/json:
              schema:
                type: object
                required: [applications]
                properties:
                  applications: { type: array, items: { $ref: '#/components/schemas/ApplicationSummary' } }
        '400': { $ref: '#/components/responses/Error' }
  /api/applications/{id}:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    get:
      tags: [Applications]
      summary: Заявка для клиента — данные, полнота, статус, решение и понятная история
      responses:
        '200':
          description: Заявка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationView' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Applications]
      summary: Изменить данные заявки
      description: Только в DRAFT, DATA_COLLECTION, READY_TO_SUBMIT, NEEDS_INFO. Состояние пересчитывается по правилам полноты.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplicationPatch' }
      responses:
        '200':
          description: Обновлённая заявка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationView' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/applications/{id}/documents:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    post:
      tags: [Applications]
      summary: Добавить документ (передаются только метаданные; файл остаётся на устройстве)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewDocument' }
      responses:
        '201':
          description: Документ добавлен
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationView' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/applications/{id}/submit:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    post:
      tags: [Applications]
      summary: Отправить заявку (READY_TO_SUBMIT → SUBMITTED)
      description: Повторный вызов в SUBMITTED идемпотентен (replayed=true). Неполная заявка — 422 со списком недостающего.
      responses:
        '200':
          description: Заявка отправлена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcessedView' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/applications/{id}/process:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    post:
      tags: [Applications]
      summary: Обработать заявку — проверка → mock-проверки → скоринг → решение
      description: |
        Выполняется атомарно в одной транзакции SQLite; каждый этап фиксируется событием.
        Повторный вызов после решения возвращает сохранённый результат (replayed=true) и не создаёт новых проверок и событий.
      responses:
        '200':
          description: Заявка обработана, состояние — APPROVED, COUNTER_OFFER, NEEDS_INFO или REJECTED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcessedView' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/applications/{id}/accept:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    post:
      tags: [Applications]
      summary: Принять предложение (APPROVED или COUNTER_OFFER → OFFER_ACCEPTED)
      responses:
        '200':
          description: Предложение принято, условия сохранены в acceptedOffer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationView' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/applications/{id}/sign:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    post:
      tags: [Applications]
      summary: Подписать договор — симуляция (OFFER_ACCEPTED → COMPLETED)
      description: Электронная подпись не создаётся, деньги не перечисляются.
      responses:
        '200':
          description: Сценарий завершён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationView' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/applications/{id}/events:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    get:
      tags: [Applications]
      summary: Полная история событий заявки
      responses:
        '200':
          description: События в порядке sequence
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events: { type: array, items: { $ref: '#/components/schemas/ApplicationEvent' } }
        '404': { $ref: '#/components/responses/Error' }
  /api/applications/{id}/scoring:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    get:
      tags: [Applications]
      summary: Результат скоринга текущей попытки
      responses:
        '200':
          description: Скоринг
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScoringResult' }
        '404': { $ref: '#/components/responses/Error' }
  /api/applications/{id}/decision:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    get:
      tags: [Applications]
      summary: Кредитное решение текущей попытки
      responses:
        '200':
          description: Решение
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditDecision' }
        '404': { $ref: '#/components/responses/Error' }
  /api/applications/{id}/matches:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    get:
      tags: [Applications]
      summary: Шаг «Подбор» — продукты под потребность заявки с объяснением
      description: Учитывает данные банка (клиент) или заявленные показатели (не клиент), предварительную проверку БКИ, платёжеспособность и ключевую ставку. Ничего не сохраняет.
      responses:
        '200':
          description: Подбор
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchesView' }
        '404': { $ref: '#/components/responses/Error' }
  /api/applications/{id}/risk:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    get:
      tags: [Applications]
      summary: Оценка ML-модели риска текущей попытки (вероятность default12m и факторы SHAP)
      responses:
        '200':
          description: Оценка риска
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiskAssessment' }
        '404': { $ref: '#/components/responses/Error' }
  /api/applications/{id}/improvements:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    get:
      tags: [Applications]
      summary: «Как улучшить заявку» — рекомендации и расчётные сценарии (что если)
      description: Сценарии считаются тем же конвейером (ML-риск, скоринг, решение) на проверках текущей попытки и не сохраняются. Результат ориентировочный, не обещание одобрения.
      responses:
        '200':
          description: Рекомендации и сценарии
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Improvements' }
        '404': { $ref: '#/components/responses/Error' }
  /api/applications/{id}/explanation:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    get:
      tags: [Assistant]
      summary: Объяснение решения или сценариев простым языком (LLM при AI_ENABLED=true, иначе шаблон)
      parameters:
        - { in: query, name: kind, schema: { type: string, enum: [decision, improvements], default: decision } }
      responses:
        '200':
          description: Объяснение
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Explanation' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/applications/{id}/issue:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    post:
      tags: [Financing]
      summary: Выдать финансирование — симуляция (COMPLETED → ACTIVE_FINANCING)
      description: Открывается моделируемый кредитный счёт с аннуитетным графиком. Деньги не перечисляются.
      responses:
        '200':
          description: Финансирование выдано (симуляция)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationView' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/applications/{id}/payments:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    post:
      tags: [Financing]
      summary: Смоделировать очередной платёж по выданному финансированию
      description: Проводки не создаются. Рекомендуется Idempotency-Key, чтобы повторный клик не учёл платёж дважды.
      responses:
        '200':
          description: Платёж учтён (симуляция)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationView' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/assistant/parse-need:
    post:
      tags: [Assistant]
      summary: Разобрать свободное описание потребности («Хочу открыть вторую кофейню… 4 млн»)
      description: Детерминированный разбор по правилам всегда доступен; при AI_ENABLED=true ответ LLM принимается только после проверки (сумма должна совпасть с найденной правилами).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 3, maxLength: 1000 }
      responses:
        '200':
          description: Структурированная потребность
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParsedNeed' }
        '400': { $ref: '#/components/responses/Error' }
  /api/bank/applications:
    get:
      tags: [Bank]
      summary: Банковская сторона — реестр заявок с оценкой, риском и решением
      responses:
        '200':
          description: Заявки
          content:
            application/json:
              schema:
                type: object
                required: [applications]
                properties:
                  applications: { type: array, items: { $ref: '#/components/schemas/BankRow' } }
  /api/bank/applications/{id}:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    get:
      tags: [Bank]
      summary: Банковская сторона — внутренний вид заявки (проверки, скоринг, решение, события)
      responses:
        '200':
          description: Заявка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankApplicationView' }
        '404': { $ref: '#/components/responses/Error' }
components:
  parameters:
    Inn:
      in: path
      name: inn
      required: true
      schema: { type: string, pattern: '^(\d{10}|\d{12})$' }
      description: ИНН с верной контрольной суммой. Синтетические компании используют неприсвоенный код региона 00.
    ApplicationId:
      in: path
      name: id
      required: true
      schema: { type: string }
  responses:
    Error:
      description: Ошибка в едином формате
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    LegacyError:
      description: Ошибка реестрового поиска
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [error, code]
      properties:
        error: { type: string, description: Понятное пользователю сообщение }
        code:
          type: string
          description: Машинный код
          example: VALIDATION_ERROR
          enum: [VALIDATION_ERROR, INVALID_INPUT, NOT_FOUND, RATE_LIMITED, INTERNAL_ERROR, COMPANY_NOT_FOUND, APPLICATION_NOT_FOUND,
            INVALID_TRANSITION, INVALID_STATE, APPLICATION_LOCKED, APPLICATION_INCOMPLETE, VERSION_CONFLICT, SCORING_NOT_READY,
            DECISION_NOT_READY, RISK_NOT_READY, IMPROVEMENTS_NOT_READY, FINANCING_REPAID, IDEMPOTENCY_KEY_REUSED,
            IDEMPOTENCY_IN_PROGRESS, INVALID_INN, FNS_NOT_CONFIGURED, FNS_UNAVAILABLE, COMPANY_ACCESS_DENIED, COMPANY_QUOTA_EXCEEDED,
            COMPANY_RATE_LIMITED, COMPANY_PROVIDER_UNAVAILABLE]
        details: { description: 'Подробности: поле с ошибкой ({ field }), допустимые переходы ({ from, to, allowed }) или недостающие пункты ({ missing })' }
    Health:
      type: object
      required: [status, service, credit, ai]
      properties:
        status: { type: string, enum: [ok] }
        service: { type: string, example: credit-cabinet }
        revision: { type: string, nullable: true }
        credit:
          type: object
          required: [products, demoCompanies, storage, keyRate, riskModel]
          properties:
            products: { type: integer, example: 6 }
            demoCompanies: { type: integer, example: 6 }
            storage: { type: string, enum: [sqlite] }
            keyRate: { type: number, example: 16, description: 'Демо-значение ключевой ставки, % (CREDIT_KEY_RATE)' }
            riskModel: { type: string, nullable: true, example: lgbm-default12m-1.0.0, description: Версия ML-модели риска; null — отключена }
        ai:
          type: object
          required: [enabled, model, endpoint, lastOutcome, lastError]
          properties:
            enabled: { type: boolean }
            model: { type: string, nullable: true, example: 'qwen2.5:7b-instruct' }
            endpoint: { type: string, enum: [local, remote], nullable: true }
            lastOutcome: { type: string, enum: [ok, fallback], nullable: true }
            lastError: { type: string, nullable: true }
    ProvidersStatus:
      type: object
      required: [company, creditChecks]
      properties:
        company:
          type: object
          required: [fnsRegistry, activeProvider]
          properties:
            fnsRegistry: { type: string, enum: [missing, ready, error] }
            activeProvider: { type: string, enum: [dadata, fns] }
        creditChecks:
          type: object
          required: [fns, bki, finance, network]
          properties:
            fns: { type: string, enum: [mock] }
            bki: { type: string, enum: [mock] }
            finance: { type: string, enum: [mock] }
            network: { type: boolean, enum: [false] }
    RegistryCompanyResponse:
      type: object
      required: [company, sources, provenance, mode, entityType, profile]
      properties:
        company: { type: object, description: Факты реестра с источником каждого поля }
        sources: { type: array, items: { type: object } }
        provenance: { type: object }
        mode: { type: string, enum: [demo, official, aggregator] }
        entityType: { type: string, enum: [ЮЛ, ИП] }
        profile: { type: object }
    ApplicationState:
      type: string
      enum: [DRAFT, DATA_COLLECTION, READY_TO_SUBMIT, SUBMITTED, VALIDATING, NEEDS_INFO, ENRICHING, RISK_ASSESSMENT, SCORING, DECISION,
        APPROVED, COUNTER_OFFER, REJECTED, OFFER_ACCEPTED, COMPLETED, ACTIVE_FINANCING]
    CreditPurpose:
      type: string
      enum: [WORKING_CAPITAL, EQUIPMENT, NEW_LOCATION, EXPANSION, INVESTMENT_PROJECT, REFINANCING, YOUNG_BUSINESS, OTHER]
    DocumentType:
      type: string
      enum: [BANK_STATEMENT, FINANCIAL_STATEMENT, REGISTRY_EXTRACT, INVESTMENT_PLAN, LOAN_AGREEMENT, OTHER]
    DecisionOutcome:
      type: string
      enum: [APPROVED, COUNTER_OFFER, NEEDS_INFO, REJECTED]
    Financials:
      type: object
      required: [revenue, expenses, profit, currentDebt, period]
      properties:
        revenue: { type: integer, description: 'Годовая выручка, ₽' }
        expenses: { type: integer, description: 'Годовые расходы, ₽' }
        profit: { type: integer, description: 'Прибыль, ₽' }
        currentDebt: { type: integer, description: 'Текущие кредиты и займы, ₽' }
        period: { type: integer, description: Отчётный год }
    DeclaredFinancials:
      type: object
      required: [revenue, expenses, currentDebt]
      properties:
        revenue: { type: integer, minimum: 1, maximum: 1000000000000 }
        expenses: { type: integer, minimum: 0, maximum: 1000000000000 }
        currentDebt: { type: integer, minimum: 0, maximum: 1000000000000 }
        activeLoans: { type: integer, minimum: 0, maximum: 99, description: Число действующих кредитов и лизингов }
    DeclaredCreditHistory:
      type: object
      required: [hadOverdue12m, maxOverdueDays]
      properties:
        hadOverdue12m: { type: boolean, description: Были ли просрочки за 12 месяцев (сверяется с БКИ) }
        maxOverdueDays: { type: integer, minimum: 0, maximum: 3650 }
    FinancingNeed:
      type: object
      required: [purpose, requestedAmount, requestedTermMonths]
      properties:
        purpose: { $ref: '#/components/schemas/CreditPurpose' }
        requestedAmount: { type: integer }
        requestedTermMonths: { type: integer }
    Company:
      type: object
      required: [inn, name, legalForm, registrationDate, okved, okvedTitle, region, employees, financials, source, relationship, bankProfile, isSynthetic, demo, updatedAt]
      properties:
        inn: { type: string }
        name: { type: string }
        legalForm: { type: string, enum: [ООО, АО, ИП, другое] }
        registrationDate: { type: string, format: date, nullable: true }
        okved: { type: string }
        okvedTitle: { type: string, nullable: true }
        region: { type: string }
        employees: { type: integer, nullable: true }
        financials: { allOf: [{ $ref: '#/components/schemas/Financials' }], nullable: true }
        source: { type: string, enum: [synthetic, manual, registry] }
        relationship: { type: string, enum: [client, non_client], description: 'Демо-связь с банком: клиенту данные подставляются, не клиент подтверждает сведения и вводит показатели' }
        bankProfile:
          type: object
          nullable: true
          required: [clientSince, monthlyTurnover, products, accountMasked]
          properties:
            clientSince: { type: string, format: date }
            monthlyTurnover: { type: integer, description: 'Средние поступления на счёт в месяц, ₽ (синтетические)' }
            products: { type: array, items: { type: string } }
            accountMasked: { type: string }
        isSynthetic: { type: boolean }
        demo:
          type: object
          nullable: true
          required: [scenario, title, description, need]
          properties:
            scenario: { $ref: '#/components/schemas/DecisionOutcome' }
            title: { type: string }
            description: { type: string }
            need: { $ref: '#/components/schemas/FinancingNeed' }
        updatedAt: { type: string, format: date-time }
        syntheticLabel: { type: string, nullable: true }
    ManualCompany:
      type: object
      required: [inn, name, registrationDate, okved, region]
      properties:
        inn: { type: string }
        name: { type: string, minLength: 2, maxLength: 160 }
        legalForm: { type: string, enum: [ООО, АО, ИП, другое] }
        registrationDate: { type: string, format: date }
        okved: { type: string, pattern: '^\d{2}(\.\d{1,2}){0,2}$' }
        region: { type: string, minLength: 2, maxLength: 100 }
        employees: { type: integer, minimum: 0, nullable: true }
    CreditProduct:
      type: object
      required: [id, name, description, minAmount, maxAmount, minTermMonths, maxTermMonths, baseRate, productMargin, minBusinessAgeMonths,
        maxBusinessAgeMonths, requiresExistingDebt, purposes, requiredDocuments, isSynthetic]
      properties:
        id: { type: string, example: working-capital }
        name: { type: string }
        description: { type: string }
        minAmount: { type: integer }
        maxAmount: { type: integer }
        minTermMonths: { type: integer }
        maxTermMonths: { type: integer }
        baseRate: { type: number, description: 'Синтетическая базовая ставка = ключевая ставка + маржа продукта, % годовых' }
        productMargin: { type: number, description: 'Синтетическая маржа продукта, п.п.' }
        minBusinessAgeMonths: { type: integer }
        maxBusinessAgeMonths: { type: integer, nullable: true, description: Верхняя граница срока работы (продукт для молодого бизнеса) }
        requiresExistingDebt: { type: boolean, description: Продукт рефинансирует действующие кредиты }
        purposes: { type: array, items: { $ref: '#/components/schemas/CreditPurpose' } }
        requiredDocuments: { type: array, items: { $ref: '#/components/schemas/DocumentType' } }
        isSynthetic: { type: boolean, enum: [true] }
    ProductMatch:
      type: object
      required: [product, eligible, recommended, checks, estimatedMonthlyPayment, pricing, totalCost, affordability, fitReasons, dataUsed, constraints, risks, alternatives]
      properties:
        product: { $ref: '#/components/schemas/CreditProduct' }
        eligible: { type: boolean }
        recommended: { type: boolean }
        checks:
          type: array
          items:
            type: object
            required: [code, ok, text]
            properties:
              code: { type: string, enum: [purpose, amount, term, businessAge, existingDebt] }
              ok: { type: boolean }
              text: { type: string }
        estimatedMonthlyPayment: { type: integer, nullable: true }
        pricing: { $ref: '#/components/schemas/Pricing' }
        totalCost: { type: integer, nullable: true, description: 'Ориентировочная переплата за весь срок, ₽' }
        affordability:
          type: object
          required: [status, paymentToProfit, maxAffordableAmount]
          properties:
            status: { type: string, enum: [ok, tight, unaffordable, unknown] }
            paymentToProfit: { type: number, nullable: true, description: Платёж / среднемесячная прибыль }
            maxAffordableAmount: { type: integer, nullable: true }
        fitReasons: { type: array, items: { type: string }, description: Почему подходит }
        dataUsed: { type: array, items: { type: string }, description: Какие данные использованы }
        constraints: { type: array, items: { type: string }, description: Ограничения продукта }
        risks: { type: array, items: { type: string } }
        alternatives: { type: array, items: { type: string } }
    Pricing:
      type: object
      required: [keyRate, productMargin, riskPremium, rate]
      description: 'Демо-ценообразование: rate = keyRate + productMargin + riskPremium. Иллюстрация, а не формула какого-либо банка.'
      properties:
        keyRate: { type: number }
        productMargin: { type: number }
        riskPremium: { type: number }
        rate: { type: number }
    MatchingFacts:
      type: object
      required: [revenue, profit, debt, maxDaysOverdue, hasCreditHistory, riskLevel, financeSource]
      properties:
        revenue: { type: integer, nullable: true }
        profit: { type: integer, nullable: true }
        debt: { type: integer, nullable: true }
        maxDaysOverdue: { type: integer, nullable: true }
        hasCreditHistory: { type: boolean, nullable: true }
        riskLevel: { allOf: [{ $ref: '#/components/schemas/RiskLevel' }], nullable: true }
        financeSource: { type: string, enum: [bank, declared, none] }
    MatchesView:
      type: object
      required: [keyRate, facts, matches]
      properties:
        keyRate: { type: number }
        facts: { $ref: '#/components/schemas/MatchingFacts' }
        matches: { type: array, items: { $ref: '#/components/schemas/ProductMatch' } }
    RiskLevel:
      type: string
      enum: [LOW, MEDIUM, HIGH]
    RiskAssessment:
      type: object
      required: [id, applicationId, attempt, modelVersion, probability, riskLevel, topFactors, createdAt]
      description: Оценка отдельной ML-модели (демо, синтетические данные). Один из входов решения, не решение.
      properties:
        id: { type: string }
        applicationId: { type: string }
        attempt: { type: integer }
        modelVersion: { type: string, example: lgbm-default12m-1.0.0 }
        probability: { type: number, minimum: 0, maximum: 1, description: Вероятность события default12m }
        riskLevel: { $ref: '#/components/schemas/RiskLevel' }
        topFactors:
          type: array
          items:
            type: object
            required: [feature, label, impact, text]
            properties:
              feature: { type: string, example: paymentToProfit }
              label: { type: string }
              impact: { type: string, enum: [positive, negative], description: 'negative — повышает риск' }
              text: { type: string, description: Пояснение простым языком }
        createdAt: { type: string, format: date-time }
    ScenarioResult:
      type: object
      required: [label, amount, termMonths, productId, monthlyPayment, paymentToProfit, affordability, score, scoreRiskLevel, mlProbability, mlRiskLevel, outcome, offerAmount, current]
      properties:
        label: { type: string }
        amount: { type: integer }
        termMonths: { type: integer }
        productId: { type: string }
        monthlyPayment: { type: integer }
        paymentToProfit: { type: number, nullable: true }
        affordability: { type: string, enum: [ok, tight, over, unknown] }
        score: { type: integer }
        scoreRiskLevel: { $ref: '#/components/schemas/RiskLevel' }
        mlProbability: { type: number, nullable: true }
        mlRiskLevel: { allOf: [{ $ref: '#/components/schemas/RiskLevel' }], nullable: true }
        outcome: { $ref: '#/components/schemas/DecisionOutcome' }
        offerAmount: { type: integer, nullable: true }
        current: { type: boolean }
    Improvements:
      type: object
      required: [disclaimer, current, scenarios, recommendations, hardStop]
      properties:
        disclaimer: { type: string }
        current: { $ref: '#/components/schemas/ScenarioResult' }
        scenarios: { type: array, items: { $ref: '#/components/schemas/ScenarioResult' } }
        recommendations:
          type: array
          items:
            type: object
            required: [code, title, text, effect]
            properties:
              code: { type: string }
              title: { type: string }
              text: { type: string }
              effect: { type: string, description: 'Осторожная формулировка («может улучшить…»)' }
        hardStop: { type: string, nullable: true, description: Стоп-фактор, который не исправить суммой и сроком }
    Explanation:
      type: object
      required: [kind, text, source, model]
      properties:
        kind: { type: string, enum: [decision, improvements] }
        text: { type: string }
        source: { type: string, enum: [llm, template] }
        model: { type: string, nullable: true }
    ParsedNeed:
      type: object
      required: [purpose, amount, businessGoal, suggestedTerm, financingCategory, recognized, source]
      properties:
        purpose: { $ref: '#/components/schemas/CreditPurpose' }
        amount: { type: integer, nullable: true }
        businessGoal: { type: string }
        suggestedTerm: { type: integer }
        financingCategory: { type: string }
        recognized: { type: array, items: { type: string, enum: [purpose, amount, term] } }
        source: { type: string, enum: [rules, llm] }
    FinancingView:
      type: object
      required: [issuedAt, productId, amount, termMonths, rate, monthlyPayment, paidInstallments, status, productName, remainingPrincipal,
        installmentsLeft, nextPayment, summary, simulated, opportunities]
      properties:
        issuedAt: { type: string, format: date-time }
        productId: { type: string }
        amount: { type: integer }
        termMonths: { type: integer }
        rate: { type: number }
        monthlyPayment: { type: integer }
        paidInstallments: { type: integer }
        status: { type: string, enum: [ACTIVE, REPAID] }
        productName: { type: string }
        remainingPrincipal: { type: integer }
        installmentsLeft: { type: integer }
        nextPayment:
          type: object
          nullable: true
          required: [date, amount]
          properties:
            date: { type: string, format: date }
            amount: { type: integer }
        summary: { type: string }
        simulated: { type: boolean, enum: [true] }
        opportunities:
          type: array
          items:
            type: object
            required: [code, title, description, available, condition, purpose]
            properties:
              code: { type: string, enum: [LIMIT_INCREASE, ADDITIONAL_WORKING_CAPITAL, REFINANCING, INVESTMENT] }
              title: { type: string }
              description: { type: string }
              available: { type: boolean }
              condition: { type: string, nullable: true }
              purpose: { allOf: [{ $ref: '#/components/schemas/CreditPurpose' }], nullable: true }
    ProductsResponse:
      type: object
      required: [products, keyRate, syntheticLabel]
      properties:
        products: { type: array, items: { $ref: '#/components/schemas/CreditProduct' } }
        keyRate: { type: number }
        matches: { type: array, items: { $ref: '#/components/schemas/ProductMatch' } }
        syntheticLabel: { type: string }
    OfferTerms:
      type: object
      required: [productId, amount, termMonths, rate, monthlyPayment]
      properties:
        productId: { type: string }
        amount: { type: integer }
        termMonths: { type: integer }
        rate: { type: number }
        monthlyPayment: { type: integer }
        pricing:
          type: object
          required: [keyRate, productMargin, riskPremium]
          properties:
            keyRate: { type: number }
            productMargin: { type: number }
            riskPremium: { type: number }
    CreditApplication:
      type: object
      required: [id, number, companyInn, productId, state, purpose, purposeDescription, requestedAmount, requestedTermMonths,
        declaredFinancials, declaredCreditHistory, attempt, version, createdAt, updatedAt, submittedAt, acceptedOffer, financing]
      properties:
        id: { type: string }
        number: { type: string, example: CR-2026-00001 }
        companyInn: { type: string }
        productId: { type: string, nullable: true }
        state: { $ref: '#/components/schemas/ApplicationState' }
        purpose: { allOf: [{ $ref: '#/components/schemas/CreditPurpose' }], nullable: true }
        purposeDescription: { type: string }
        requestedAmount: { type: integer, nullable: true }
        requestedTermMonths: { type: integer, nullable: true }
        declaredFinancials: { allOf: [{ $ref: '#/components/schemas/DeclaredFinancials' }], nullable: true }
        attempt: { type: integer, description: 'Номер подачи; проверки, оценки и решения относятся к попытке' }
        version: { type: integer, description: Версия для оптимистичной блокировки (PATCH version) }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        submittedAt: { type: string, format: date-time, nullable: true }
        acceptedOffer: { allOf: [{ $ref: '#/components/schemas/OfferTerms' }], nullable: true }
        declaredCreditHistory: { allOf: [{ $ref: '#/components/schemas/DeclaredCreditHistory' }], nullable: true }
        financing:
          type: object
          nullable: true
          description: Моделируемый кредитный счёт после выдачи
          required: [issuedAt, productId, amount, termMonths, rate, monthlyPayment, paidInstallments, status]
          properties:
            issuedAt: { type: string, format: date-time }
            productId: { type: string }
            amount: { type: integer }
            termMonths: { type: integer }
            rate: { type: number }
            monthlyPayment: { type: integer }
            paidInstallments: { type: integer }
            status: { type: string, enum: [ACTIVE, REPAID] }
    CreateApplication:
      type: object
      required: [companyInn]
      additionalProperties: false
      properties:
        companyInn: { type: string }
        company: { $ref: '#/components/schemas/ManualCompany' }
        productId: { type: string, nullable: true }
        purpose: { $ref: '#/components/schemas/CreditPurpose' }
        purposeDescription: { type: string, maxLength: 2000 }
        requestedAmount: { type: integer, minimum: 10000, maximum: 1000000000 }
        requestedTermMonths: { type: integer, minimum: 1, maximum: 120 }
        declaredFinancials: { allOf: [{ $ref: '#/components/schemas/DeclaredFinancials' }], nullable: true }
        declaredCreditHistory: { allOf: [{ $ref: '#/components/schemas/DeclaredCreditHistory' }], nullable: true }
    ApplicationPatch:
      type: object
      additionalProperties: false
      properties:
        productId: { type: string, nullable: true }
        purpose: { $ref: '#/components/schemas/CreditPurpose' }
        purposeDescription: { type: string, maxLength: 2000 }
        requestedAmount: { type: integer, minimum: 10000, maximum: 1000000000 }
        requestedTermMonths: { type: integer, minimum: 1, maximum: 120 }
        declaredFinancials: { allOf: [{ $ref: '#/components/schemas/DeclaredFinancials' }], nullable: true }
        declaredCreditHistory: { allOf: [{ $ref: '#/components/schemas/DeclaredCreditHistory' }], nullable: true }
        version: { type: integer, description: Ожидаемая версия; при расхождении — 409 VERSION_CONFLICT }
    NewDocument:
      type: object
      required: [type, fileName, sizeBytes]
      properties:
        type: { $ref: '#/components/schemas/DocumentType' }
        fileName: { type: string, maxLength: 200 }
        mimeType: { type: string, maxLength: 100 }
        sizeBytes: { type: integer, minimum: 1, maximum: 10485760 }
        textCharacters: { type: integer, nullable: true, description: 'Символов текста, извлечённых в браузере' }
    ApplicationDocument:
      type: object
      required: [id, applicationId, type, fileName, mimeType, sizeBytes, textCharacters, uploadedAt]
      properties:
        id: { type: string }
        applicationId: { type: string }
        type: { $ref: '#/components/schemas/DocumentType' }
        fileName: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer }
        textCharacters: { type: integer, nullable: true }
        uploadedAt: { type: string, format: date-time }
    Readiness:
      type: object
      required: [ready, completeness, items, missing]
      properties:
        ready: { type: boolean }
        completeness: { type: number, minimum: 0, maximum: 1 }
        items: { type: array, items: { $ref: '#/components/schemas/ReadinessItem' } }
        missing: { type: array, items: { $ref: '#/components/schemas/ReadinessItem' } }
    ReadinessItem:
      type: object
      required: [code, label, done, required, group]
      properties:
        code: { type: string }
        label: { type: string }
        done: { type: boolean }
        required: { type: boolean }
        hint: { type: string }
        group: { type: string, enum: [company, finance, obligations, history, financing, documents], description: Группа анкеты }
    ExternalCheck:
      type: object
      required: [id, applicationId, attempt, provider, status, payload, checkedAt]
      properties:
        id: { type: string }
        applicationId: { type: string }
        attempt: { type: integer }
        provider: { type: string, enum: [FNS, BKI, FINANCE] }
        status: { type: string, enum: [OK, NO_HISTORY, NOT_FOUND, DOCUMENT_BASED] }
        payload:
          type: object
          nullable: true
          description: 'FNS: active, registrationDate, okved. BKI: activeDebt, overdueAmount, maxDaysOverdue, hasHistory, activeLoans, latePayments12m. FINANCE: revenue, expenses, profit, currentDebt, period.'
        checkedAt: { type: string, format: date-time }
    ScoringFactor:
      type: object
      required: [code, title, impact, maxImpact, effect, explanation]
      properties:
        code: { type: string, enum: [businessAge, paymentDiscipline, debtLoad, requestedAmountToRevenue, profitability, applicationCompleteness] }
        title: { type: string }
        impact: { type: integer, description: Набранные баллы }
        maxImpact: { type: integer, description: Вес фактора }
        effect: { type: string, enum: [positive, neutral, negative] }
        explanation: { type: string }
    ScoringResult:
      type: object
      required: [id, applicationId, attempt, score, riskLevel, dataComplete, factors, createdAt]
      properties:
        id: { type: string }
        applicationId: { type: string }
        attempt: { type: integer }
        score: { type: integer, minimum: 0, maximum: 100 }
        riskLevel: { $ref: '#/components/schemas/RiskLevel' }
        dataComplete: { type: boolean }
        factors: { type: array, items: { $ref: '#/components/schemas/ScoringFactor' } }
        createdAt: { type: string, format: date-time }
    DecisionReason:
      type: object
      required: [code, kind, text]
      properties:
        code: { type: string }
        kind: { type: string, enum: [positive, warning, negative, info] }
        text: { type: string }
    RequiredInfo:
      type: object
      required: [code, text]
      properties:
        code: { type: string }
        text: { type: string }
        field: { type: string, enum: [declaredFinancials] }
        documentType: { $ref: '#/components/schemas/DocumentType' }
    CreditDecision:
      type: object
      required: [id, applicationId, attempt, outcome, offer, reasons, requiredInfo, summary, nextAction, createdAt]
      properties:
        id: { type: string }
        applicationId: { type: string }
        attempt: { type: integer }
        outcome: { $ref: '#/components/schemas/DecisionOutcome' }
        offer: { allOf: [{ $ref: '#/components/schemas/OfferTerms' }], nullable: true }
        reasons: { type: array, items: { $ref: '#/components/schemas/DecisionReason' } }
        requiredInfo: { type: array, items: { $ref: '#/components/schemas/RequiredInfo' } }
        summary: { type: string, example: Мы готовы предложить 9 900 000 ₽ на 60 месяцев вместо запрошенных 15 000 000 ₽ на 36 месяцев. }
        nextAction: { type: string }
        createdAt: { type: string, format: date-time }
    ApplicationEvent:
      type: object
      required: [id, applicationId, sequence, type, fromState, toState, message, payload, createdAt]
      properties:
        id: { type: string }
        applicationId: { type: string }
        sequence: { type: integer }
        type: { type: string, enum: [CREATED, UPDATED, STATE_CHANGED, DOCUMENT_ADDED, CHECK_COMPLETED, RISK_ASSESSED, SCORED, DECIDED, PAYMENT_SIMULATED] }
        fromState: { allOf: [{ $ref: '#/components/schemas/ApplicationState' }], nullable: true }
        toState: { allOf: [{ $ref: '#/components/schemas/ApplicationState' }], nullable: true }
        message: { type: string }
        payload: { type: object, nullable: true }
        createdAt: { type: string, format: date-time }
    TimelineItem:
      type: object
      required: [sequence, type, state, message, createdAt]
      properties:
        sequence: { type: integer }
        type: { type: string }
        state: { allOf: [{ $ref: '#/components/schemas/ApplicationState' }], nullable: true }
        message: { type: string, description: Понятное клиенту описание этапа }
        createdAt: { type: string, format: date-time }
    ApplicationView:
      type: object
      required: [application, company, product, documents, readiness, status, decision, offerProduct, financing, timeline]
      properties:
        application: { $ref: '#/components/schemas/CreditApplication' }
        company: { $ref: '#/components/schemas/Company' }
        product: { allOf: [{ $ref: '#/components/schemas/CreditProduct' }], nullable: true }
        documents: { type: array, items: { $ref: '#/components/schemas/ApplicationDocument' } }
        readiness: { $ref: '#/components/schemas/Readiness' }
        status:
          type: object
          required: [title, next, processing, editable]
          properties:
            title: { type: string, description: Текущий статус простыми словами }
            next: { type: string, description: Следующий шаг клиента }
            processing: { type: boolean }
            editable: { type: boolean }
        decision: { allOf: [{ $ref: '#/components/schemas/CreditDecision' }], nullable: true }
        offerProduct: { allOf: [{ $ref: '#/components/schemas/CreditProduct' }], nullable: true }
        financing: { allOf: [{ $ref: '#/components/schemas/FinancingView' }], nullable: true }
        timeline: { type: array, items: { $ref: '#/components/schemas/TimelineItem' } }
    ProcessedView:
      allOf:
        - $ref: '#/components/schemas/ApplicationView'
        - type: object
          required: [replayed]
          properties:
            replayed: { type: boolean, description: 'true — результат уже существовал, повторный вызов ничего не изменил' }
    BankApplicationView:
      allOf:
        - $ref: '#/components/schemas/ApplicationView'
        - type: object
          required: [checks, scoring, riskAssessment, riskModelVersion, history, events]
          properties:
            checks: { type: array, items: { $ref: '#/components/schemas/ExternalCheck' } }
            scoring: { allOf: [{ $ref: '#/components/schemas/ScoringResult' }], nullable: true }
            riskAssessment: { allOf: [{ $ref: '#/components/schemas/RiskAssessment' }], nullable: true }
            riskModelVersion: { type: string, nullable: true }
            history:
              type: object
              required: [checks]
              properties:
                checks: { type: array, items: { $ref: '#/components/schemas/ExternalCheck' }, description: Проверки всех попыток }
            events: { type: array, items: { $ref: '#/components/schemas/ApplicationEvent' } }
    ApplicationSummary:
      type: object
      required: [id, number, state, status, companyInn, companyName, isSynthetic, productId, productName, requestedAmount, requestedTermMonths, createdAt, updatedAt]
      properties:
        id: { type: string }
        number: { type: string }
        state: { $ref: '#/components/schemas/ApplicationState' }
        status:
          type: object
          required: [title, next]
          properties:
            title: { type: string }
            next: { type: string }
        companyInn: { type: string }
        companyName: { type: string }
        isSynthetic: { type: boolean }
        productId: { type: string, nullable: true }
        productName: { type: string, nullable: true }
        requestedAmount: { type: integer, nullable: true }
        requestedTermMonths: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    BankRow:
      allOf:
        - $ref: '#/components/schemas/ApplicationSummary'
        - type: object
          required: [score, riskLevel, mlProbability, mlRiskLevel, relationship, outcome]
          properties:
            score: { type: integer, nullable: true }
            riskLevel: { allOf: [{ $ref: '#/components/schemas/RiskLevel' }], nullable: true }
            mlProbability: { type: number, nullable: true }
            mlRiskLevel: { allOf: [{ $ref: '#/components/schemas/RiskLevel' }], nullable: true }
            relationship: { type: string, enum: [client, non_client] }
            outcome: { allOf: [{ $ref: '#/components/schemas/DecisionOutcome' }], nullable: true }
