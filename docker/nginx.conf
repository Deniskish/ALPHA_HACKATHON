server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
  client_max_body_size 48k;
  add_header X-Content-Type-Options nosniff always;
  location /api/ {
    proxy_pass http://api:3002;
    proxy_set_header Host $host;
    # Overwrite (not append) the client address: the API trusts this private hop (TRUST_PROXY), so a client-supplied
    # X-Forwarded-For must never reach it, otherwise a client could pick its own rate-limit identity.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 45s;
  }
  location ~ "^/assets/.+-[A-Za-z0-9_-]{8,}\.(js|css|woff2|webp|avif|png|jpe?g|svg)$" { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; }
  location /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=3600"; }
  location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
